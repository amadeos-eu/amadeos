# /etc/live/config.conf
# live-config settings of the amadeOS live image: the one place for them. The kernel command line
# (scripts/build-image.sh, BOOTAPPEND) only says boot=live components, so nothing there overrides this.
# The variables are documented in live-config(7).
LIVE_HOSTNAME="amadeos"
LIVE_USERNAME="amadeos"
# The password 'amadeos' is set by /usr/local/bin/amadeos-dm at boot; live-config has no option for it.
# lpadmin: printer administration in amade-print and the CUPS web interface.
# systemd-journal: the whole journal in the Tools drawer's log viewer and journalctl, not only the user's messages.
LIVE_USER_DEFAULT_GROUPS="audio,cdrom,dip,floppy,video,plugdev,netdev,powerdev,scanner,bluetooth,lpadmin,systemd-journal,sudo"
# German keyboard; the login greeter can switch to US.
LIVE_KEYBOARD_LAYOUTS="de"
# The clock of the live image, like the keyboard and the locale (/etc/default/locale); changed at login in the greeter.
LIVE_TIMEZONE="Europe/Berlin"
