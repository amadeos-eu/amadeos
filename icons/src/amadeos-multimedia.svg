<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" shape-rendering="crispEdges">
  <!-- Clapperboard body: slate with Motif bevel -->
  <rect x="3" y="17" width="32" height="25" fill="#3C3C44"/>
  <path d="M3 17h32v1H4v24H3z" fill="#7C7C88"/>
  <path d="M35 17v26H3v-1h31V17z" fill="#000"/>
  <!-- Chalk lines on the slate -->
  <rect x="7" y="24" width="16" height="1" fill="#A8A8B4"/>
  <rect x="7" y="29" width="12" height="1" fill="#A8A8B4"/>
  <rect x="7" y="34" width="14" height="1" fill="#A8A8B4"/>
  <!-- Fixed stick with stripes -->
  <rect x="3" y="12" width="32" height="5" fill="#F0F0F0"/>
  <path d="M5 12h5l-3 5H2z M15 12h5l-3 5h-5z M25 12h5l-3 5h-5z" fill="#202020" shape-rendering="geometricPrecision"/>
  <path d="M3 12h32v1H3z" fill="#fff"/>
  <path d="M3 16.5h32" stroke="#000" stroke-width="1"/>
  <!-- Opened clapper arm, hinged at the left -->
  <g transform="rotate(-18 4 11)" shape-rendering="geometricPrecision">
    <rect x="3" y="6" width="32" height="5" fill="#F0F0F0" stroke="#000" stroke-width="1"/>
    <path d="M8 6h5l-3 5H5z M18 6h5l-3 5h-5z M28 6h5l-3 5h-5z" fill="#202020"/>
  </g>
  <circle cx="4.5" cy="11.5" r="1.5" fill="#808080" stroke="#000" stroke-width="0.8" shape-rendering="geometricPrecision"/>
  <!-- Beamed eighth notes in front -->
  <g shape-rendering="geometricPrecision">
    <path d="M32 21 L45 18 L45 22 L32 25 Z" fill="#1E3C78" stroke="#000" stroke-width="0.8"/>
    <rect x="31.2" y="22" width="1.8" height="17" fill="#1E3C78" stroke="#000" stroke-width="0.6"/>
    <rect x="43.2" y="19" width="1.8" height="17" fill="#1E3C78" stroke="#000" stroke-width="0.6"/>
    <ellipse cx="28.8" cy="39.5" rx="4" ry="3" transform="rotate(-20 28.8 39.5)" fill="#3A64B4" stroke="#000" stroke-width="0.8"/>
    <ellipse cx="40.8" cy="36.5" rx="4" ry="3" transform="rotate(-20 40.8 36.5)" fill="#3A64B4" stroke="#000" stroke-width="0.8"/>
    <ellipse cx="27.8" cy="38.6" rx="1.4" ry="0.8" transform="rotate(-20 27.8 38.6)" fill="#9CB8EC"/>
    <ellipse cx="39.8" cy="35.6" rx="1.4" ry="0.8" transform="rotate(-20 39.8 35.6)" fill="#9CB8EC"/>
  </g>
</svg>
