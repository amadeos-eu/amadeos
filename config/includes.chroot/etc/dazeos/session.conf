# /etc/dazeos/session.conf
# DazeOS X11 Desktop Session Manifest & Configuration

# Primary application JAR path
DAZEOS_JAR="/opt/dazeos/dazeos-demo.jar"

# Java runtime options (enables JNA native access for Java 21+)
JAVA_OPTS="--enable-native-access=ALL-UNNAMED"

# Window Manager supervision
WM_ENABLED="true"
WM_AUTO_RESTART="true"
WM_LOG_FILE="${HOME:-/tmp}/.dazeos-wm.log"

# Session logging
SESSION_LOG_FILE="${HOME:-/tmp}/.dazeos-session.log"

# Primary desktop autostart application ('demo' or a custom command)
AUTOSTART_APP="demo"
