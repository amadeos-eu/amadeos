<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <!-- Default desktop wallpaper. Rendered to
       config/includes.chroot/usr/share/backgrounds/amadeos/wallpaper.png and
       src/main/resources/wallpapers/default.png. The front panel covers the bottom 85 px. -->
  <defs>
    <!-- Same slate-blue gradient as the login greeter and the boot menu -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B546E"/>
      <stop offset="1" stop-color="#223344"/>
    </linearGradient>
    <radialGradient id="glow" cx="960" cy="470" r="760" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M0 0.5H32M0.5 0V32" stroke="#FFFFFF" stroke-opacity="0.045" stroke-width="1" fill="none"/>
    </pattern>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>
  <rect width="1920" height="1080" fill="url(#glow)"/>

  <!-- Centred emblem and name (emblem + gap + "amadeOS" at 124 px is 826 px wide) -->
  <g transform="translate(-123 0)" opacity="0.8">
  <!-- Emblem: the four workspaces of the front panel, "One" active, with Motif bevels -->
  <g shape-rendering="crispEdges">
    <rect x="670" y="400" width="64" height="50" fill="#4E7A96"/>
    <path d="M670 400h64v2h-62v48h-2z" fill="#27384A"/>
    <path d="M734 400v52h-64v-2h62v-50z" fill="#9CB8D0"/>
    <rect x="742" y="400" width="64" height="50" fill="#C8BEB4"/>
    <path d="M742 400h64v2h-62v48h-2z" fill="#F0ECE8"/>
    <path d="M806 400v52h-64v-2h62v-50z" fill="#6E6660"/>
    <rect x="670" y="458" width="64" height="50" fill="#C8BEB4"/>
    <path d="M670 458h64v2h-62v48h-2z" fill="#F0ECE8"/>
    <path d="M734 458v52h-64v-2h62v-50z" fill="#6E6660"/>
    <rect x="742" y="458" width="64" height="50" fill="#C8BEB4"/>
    <path d="M742 458h64v2h-62v48h-2z" fill="#F0ECE8"/>
    <path d="M806 458v52h-64v-2h62v-50z" fill="#6E6660"/>
  </g>

  <text x="836" y="500" font-family="DejaVu Sans" font-weight="bold" font-size="124" fill="#E0E8F0">amadeOS</text>
  </g>
  <text x="960" y="598" text-anchor="middle" font-family="DejaVu Sans" font-size="34" fill="#C8D6E4" fill-opacity="0.6">Digital Sovereignty starts on your desktop.</text>
</svg>
