# /etc/amadeos/session.conf
# amadeOS X11 Desktop Session Manifest & Configuration

# Primary application JAR path
AMADEOS_JAR="/opt/amadeos/amadeos.jar"

# Java runtime options (enables JNA native access for Java 21+)
JAVA_OPTS="--enable-native-access=ALL-UNNAMED"

# Window Manager supervision
WM_ENABLED="true"
WM_AUTO_RESTART="true"
WM_LOG_FILE="${HOME:-/tmp}/.amadeos-wm.log"

# Session logging
SESSION_LOG_FILE="${HOME:-/tmp}/.amadeos-session.log"

# Primary desktop autostart application ('panel' or a custom command)
AUTOSTART_APP="panel"

